version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sponsor_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sponsor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sponsor_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sponsor_marketplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sponsor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sponsor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for future caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: sponsor_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sponsor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: sponsor_api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sponsor}:${POSTGRES_PASSWORD:-sponsor_secret}@postgres:5432/${POSTGRES_DB:-sponsor_marketplace}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379
      # Sentry 설정
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Seed는 운영에서 기본 OFF
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - sponsor_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 운영 시작 시 마이그레이션 자동 실행
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[Startup] Running database migrations..."
        npx prisma migrate deploy

        if [ "$$RUN_SEED" = "true" ]; then
          echo "[Startup] Running seed (RUN_SEED=true)..."
          npm run db:seed
        fi

        echo "[Startup] Starting server..."
        npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend (Nginx + Static Files)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: sponsor_web
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - sponsor_network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for single entry point)
  nginx:
    image: nginx:alpine
    container_name: sponsor_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PROXY_PORT:-80}:80"
      - "${PROXY_SSL_PORT:-443}:443"
    networks:
      - sponsor_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - with-proxy

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  sponsor_network:
    driver: bridge
