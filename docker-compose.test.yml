version: '3.8'

# 테스트용 Docker Compose
# 사용법: docker-compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:16
    container_name: screengolf-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screengolf_test
    ports:
      - "55432:5432"
    volumes:
      - screengolf_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screengolf_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  screengolf_test_data:
