name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # =========================================
  # Backend: Lint, TypeCheck, Unit Tests
  # =========================================
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true  # lint 없으면 skip

      - name: Check migrations
        run: npm run db:check-migrations
        continue-on-error: true  # 첫 실행 시 skip 가능

  # =========================================
  # Backend: E2E Tests (with PostgreSQL)
  # =========================================
  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: screengolf_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup test database
        run: npm run test:e2e:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:55432/screengolf_test?schema=public

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:55432/screengolf_test?schema=public
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters

  # =========================================
  # Frontend: Lint, TypeCheck, Build
  # =========================================
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  # =========================================
  # All checks passed
  # =========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-check, backend-e2e, frontend-check]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed!"
