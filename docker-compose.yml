version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: screengolf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screengolf
    ports:
      - "5432:5432"
    volumes:
      - screengolf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screengolf"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  screengolf_data:
